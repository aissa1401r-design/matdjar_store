<!DOCTYPE html>
<html dir="rtl" lang="ar"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الإدارة</title>
<style>body{font-family:Tahoma;background:#f5f5f5;direction:rtl;padding:15px}.box{max-width:500px;margin:auto;background:#fff;padding:20px;border-radius:15px;box-shadow:0 2px 10px #0002}input,select{width:100%;padding:14px;margin:8px 0;border:2px solid #000;border-radius:8px;font-size:16px;box-sizing:border-box}button{width:100%;padding:15px;background:#000;color:#fff;font-weight:bold;border-radius:8px;font-size:18px;margin-top:10px}label{font-weight:bold;display:block;margin-top:12px}</style></head><body>
<div class="box">
<h2>إضافة منتج جديد</h2>
<form method="post" action="/admin/add_prod">
<label>1 - اسم المنتج (مثال: قميص)</label>
<input name="name" type="text" placeholder="قميص" required>

<label>2 - السعر (مثال: 2500)</label>
<input name="price" type="number" placeholder="2500" required>

<label>3 - اختر النوع</label>
<select name="cat_id" required>
{% for c in cats %}<option value="{{c[0]}}">{{c[1]}}</option>{% else %}<option value="1">عام</option>{% endfor %}
</select>

<label>4 - رابط الصورة</label>
<input name="image" type="url" value="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=400" required>

<button>حفظ المنتج ✅</button>
</form>
<br><a href="/">← للمتجر</a> | <a href="/seed">تصفير</a>
</div></body></html>
