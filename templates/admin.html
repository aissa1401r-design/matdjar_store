<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>الإدارة</title>
<style>body{font-family:Tahoma;background:#f5f5f5;direction:rtl;padding:15px}.admin-wrap{max-width:600px;margin:auto;background:white;padding:15px;border-radius:15px}input,select{width:100%;padding:14px;margin:8px 0;border:2px solid #000;border-radius:8px;background:#fff;color:#000;font-size:16px}button{width:100%;padding:14px;background:black;color:white;font-weight:bold;border-radius:8px;font-size:18px}.card{display:flex;gap:10px;align-items:center;background:#eee;padding:10px;border-radius:10px;margin:6px 0}.card img{width:50px;height:50px;object-fit:cover;border-radius:8px}.del{background:red;color:white;padding:8px 12px;border-radius:6px;text-decoration:none}label{font-weight:bold;margin-top:10px;display:block;color:#000}</style>
</head><body><div class="admin-wrap">
<h2>➕ زيد نوع أولاً</h2>
<form method="post" action="/admin/add_cat"><input name="name" placeholder="مثلا: ملابس" required><button>حفظ النوع</button></form>
{% for c in cats %}<div class="card"><div style="flex:1">{{c[1]}} (ID:{{c[0]}})</div><a class="del" href="/admin/del_cat/{{c[0]}}">حذف</a></div>{% endfor %}

<hr style="margin:20px 0">
<h2>➕ زيد منتج (بعد ما تزيد النوع)</h2>
<form method="post" action="/admin/add_prod">
<label>1- اسم المنتج:</label><input name="name" placeholder="مثلا: قميص" required>
<label>2- السعر:</label><input name="price" type="number" placeholder="2500" required>
<label>3- اختر النوع:</label><select name="cat_id" required>{% for c in cats %}<option value="{{c[0]}}">{{c[1]}}</option>{% endfor %}</select>
<label>4- رابط الصورة الحقيقي:</label><input name="image" value="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400" required>
<button>حفظ المنتج ✅</button>
</form>
<br><a href="/">← للمتجر</a>
</div></body></html>
